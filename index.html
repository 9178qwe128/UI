<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卫星云图 · 台风增强色</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body, #map { height:100%; width:100%; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; overflow:hidden; background:#05070d; }
  .leaflet-container { background:#05070d; }

  .panel {
    position:absolute; top:16px; left:16px; z-index:1000; width:302px;
    background:rgba(10,14,24,.8); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.09); border-radius:14px;
    padding:16px 18px 14px; color:#e8ecf4; box-shadow:0 8px 32px rgba(0,0,0,.55);
  }
  .panel h1 { font-size:15px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .live { width:8px; height:8px; border-radius:50%; background:#ff4d4f; flex:none; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,77,79,.55)} 70%{box-shadow:0 0 0 8px rgba(255,77,79,0)} 100%{box-shadow:0 0 0 0 rgba(255,77,79,0)} }
  .status { margin-left:auto; font-size:11px; font-weight:400; color:#38bdf8; }

  .row { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; }
  .row label { color:#aeb6c8; flex:none; }
  .row input[type=range] { flex:1; accent-color:#38bdf8; height:22px; cursor:pointer; }

  .sw { position:relative; width:42px; height:22px; appearance:none; -webkit-appearance:none; background:#2a3346; border-radius:11px; cursor:pointer; transition:.2s; outline:none; flex:none; }
  .sw:checked { background:#38bdf8; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; }
  .sw:checked::after { left:23px; }

  .play { width:34px; height:34px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.16); background:rgba(56,189,248,.14); color:#38bdf8; font-size:13px; cursor:pointer; transition:.15s; }
  .play:hover { background:rgba(56,189,248,.3); }
  .time { font-variant-numeric:tabular-nums; font-size:11.5px; color:#8fa3bf; }

  .legend { margin-top:16px; }
  .legend canvas { width:100%; height:12px; border-radius:6px; display:block; }
  .legend .lab { display:flex; justify-content:space-between; font-size:10px; color:#7c8aa5; margin-top:4px; }

  .src { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.07); font-size:10.5px; color:#66738c; line-height:1.6; }

  /* 时间范围切换 */
  .seg { display:flex; background:#1a2233; border-radius:8px; padding:2px; gap:2px; }
  .seg button { border:0; background:transparent; color:#8fa3bf; font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .seg button.on { background:#38bdf8; color:#06222f; font-weight:600; }

  /* 形成过程入口按钮 */
  .howbtn { margin-top:14px; width:100%; padding:9px 0; border-radius:10px; border:1px solid rgba(56,189,248,.35); background:rgba(56,189,248,.1); color:#7dd3fc; font-size:13px; cursor:pointer; transition:.15s; }
  .howbtn:hover { background:rgba(56,189,248,.22); }

  /* 形成过程图解弹层 */
  .overlay { position:fixed; inset:0; z-index:2000; background:rgba(3,6,12,.72); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; padding:18px; }
  .overlay.show { display:flex; }
  .how { width:min(680px,96vw); background:rgba(12,18,30,.96); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px 22px 16px; color:#e8ecf4; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); max-height:94vh; overflow:auto; }
  .how h2 { font-size:16px; margin-bottom:10px; }
  .how svg { width:100%; border-radius:10px; display:block; background:#0a1526; }
  .close { position:absolute; top:10px; right:12px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(255,255,255,.08); color:#cbd5e1; font-size:15px; cursor:pointer; }
  .close:hover { background:rgba(255,255,255,.18); }
  .cap { margin-top:12px; min-height:66px; }
  .cap b { font-size:14px; color:#7dd3fc; }
  .cap p { font-size:12.5px; color:#aeb6c8; line-height:1.7; margin-top:4px; }
  .howNav { margin-top:10px; display:flex; align-items:center; justify-content:space-between; }
  .howNav button { border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#cbd5e1; font-size:12.5px; padding:6px 14px; border-radius:8px; cursor:pointer; }
  .howNav button:hover:not(:disabled) { background:rgba(56,189,248,.2); }
  .howNav button:disabled { opacity:.35; cursor:default; }
  .dots { display:flex; gap:8px; }
  .dots span { width:9px; height:9px; border-radius:50%; background:#334155; cursor:pointer; transition:.2s; }
  .dots span.on { background:#38bdf8; transform:scale(1.25); }

  /* 图解 SVG 动画 */
  .stg { opacity:0; transition:opacity .7s; }
  .stg.on { opacity:1; }
  .rise { animation:rise 2.4s linear infinite; }
  @keyframes rise { 0%{opacity:0; transform:translateY(16px)} 25%{opacity:1} 80%{opacity:.9} 100%{opacity:0; transform:translateY(-30px)} }
  .puff { animation:puff 3s ease-in-out infinite; transform-origin:320px 115px; }
  @keyframes puff { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .blink { animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:.15} 50%{opacity:.85} }
  .rain { animation:rain 1.2s linear infinite; }
  @keyframes rain { 0%{opacity:0; transform:translateY(-4px)} 30%{opacity:1} 100%{opacity:0; transform:translateY(26px)} }
  .spinSlow { animation:rotCCW 14s linear infinite; transform-origin:320px 180px; }
  .spin { animation:rotCCW 6s linear infinite; transform-origin:320px 180px; }
  @keyframes rotCCW { from{transform:rotate(0)} to{transform:rotate(-360deg)} }
  .sink { animation:sink 1.6s ease-in-out infinite; }
  @keyframes sink { 0%,100%{transform:translateY(-4px); opacity:.6} 50%{transform:translateY(6px); opacity:1} }

  @media (max-width:520px) {
    .panel { width:calc(100% - 24px); left:12px; top:12px; padding:12px 14px; }
  }
</style>
</head>
<body>

<div class="panel">

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------------- 台风增强色查找表（亮度 -> RGB） ---------------- */
const STOPS = [
  [  0,  10, 14, 40],   // 海面（暖）
  [ 90,  35, 40, 70],
  [105,  70, 74, 84],
  [125, 112,116,126],   // 低云 / 暖云：灰阶
  [145, 142,146,156],
  [152, 150,200,235],   // 浅蓝
  [165,  60,190,255],   // 蓝
  [178,   0,228,198],   // 青
  [190,  30,208, 92],   // 绿
  [202, 255,236,  0],   // 黄
  [215, 255,148,  0],   // 橙
  [228, 255, 42, 32],   // 红
  [240, 218,  0,255],   // 品红
  [248, 150, 80,255],   // 紫
  [255, 255,255,255]    // 强对流云顶：白
];
const LUT = new Uint8ClampedArray(768);
(function buildLUT(){
  let k = 0;
  for (let v = 0; v < 256; v++) {
    while (k < STOPS.length - 2 && v > STOPS[k+1][0]) k++;
    const a = STOPS[k], b = STOPS[k+1];
    const t = b[0] > a[0] ? (v - a[0]) / (b[0] - a[0]) : 0;
    LUT[v*3]   = a[1] + (b[1]-a[1]) * t;
    LUT[v*3+1] = a[2] + (b[2]-a[2]) * t;
    LUT[v*3+2] = a[3] + (b[3]-a[3]) * t;
  }
})();

/* ---------------- 云图瓦片图层（canvas 实时上色） ---------------- */
const TILE_URL = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/Himawari_AHI_Band13_Clean_Infrared/default/{t}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png';

const EnhanceLayer = L.TileLayer.extend({
  initialize: function (url, options) {
    L.TileLayer.prototype.initialize.call(this, url, options);
    this._imgCache = new Map(); // url -> Image，避免切帧/换色时重复下载
  },
  getTileUrl: function (coords) {
    return this._url
      .replace('{t}', this.options.time)
      .replace('{z}', this._getZoomForUrl())
      .replace('{y}', coords.y)
      .replace('{x}', coords.x);
  },
  createTile: function (coords, done) {
    const size = this.getTileSize();
    const canvas = document.createElement('canvas');
    canvas.width = size.x; canvas.height = size.y;
    const url = this.getTileUrl(coords);

    const draw = (img) => {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (img && img.naturalWidth) {
        ctx.drawImage(img, 0, 0, size.x, size.y);
        if (this.options.enhanced) {
          const d = ctx.getImageData(0, 0, size.x, size.y);
          const p = d.data;
          for (let i = 0; i < p.length; i += 4) {
            if (p[i+3] === 0) continue;            // 圆盘外透明区跳过
            const v = (p[i]*77 + p[i+1]*150 + p[i+2]*29) >> 8; // 亮度
            const o = v * 3;
            p[i] = LUT[o]; p[i+1] = LUT[o+1]; p[i+2] = LUT[o+2];
          }
          ctx.putImageData(d, 0, 0);
        }
      }
      done(null, canvas);
    };

    const cached = this._imgCache.get(url);
    if (cached && cached.complete && cached.naturalWidth) {
      // 必须异步回调：Leaflet 在 createTile 返回后才登记瓦片，同步 done 会被丢弃
      setTimeout(() => draw(cached), 0);
    } else {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload  = () => {
        if (this._imgCache.size > 400) {          // 限制缓存体积
          this._imgCache.delete(this._imgCache.keys().next().value);
        }
        this._imgCache.set(url, img);
        draw(img);
      };
      img.onerror = () => done(null, canvas);      // 缺帧时留空，不报错
      img.src = url;
    }
    return canvas;
  }
});

/* ---------------- 时间轴：实时（10 分钟/帧）或 5 天回放（1 小时/帧） ---------------- */
const LATENCY = 50 * 60000;
const MODES = {
  live: { step: 10 * 60000, count: 24  },   // 实时：最近 4 小时
  hist: { step: 60 * 60000, count: 120 }    // 回放：最近 5 天，可看到台风成形过程
};
let mode = 'live';
let frames = [], idx = 0;

function buildFrames() {
  const m = MODES[mode];
  const latest = Math.floor((Date.now() - LATENCY) / m.step) * m.step;
  const wasLast = (idx === frames.length - 1);
  frames = [];
  for (let i = m.count - 1; i >= 0; i--) frames.push(latest - i * m.step);
  if (wasLast || idx >= frames.length) idx = frames.length - 1;
  document.getElementById('tl').max = frames.length - 1;
}

/* 帧可用性探测：GIBS 个别时刻缺图，提前标记，避免切到空白帧 */
const badFrames = new Set();
function probeFrames() {
  frames.forEach((ms) => {
    const url = TILE_URL.replace('{t}', new Date(ms).toISOString().replace('.000', ''))
                        .replace('{z}', 3).replace('{y}', 3).replace('{x}', 7);
    fetch(url).then(r => r.ok ? badFrames.delete(ms) : badFrames.add(ms))
              .catch(() => badFrames.add(ms));
  });
}

/* ---------------- 地图 ---------------- */
const map = L.map('map', {
  center: [20, 128], zoom: 4, minZoom: 3, maxZoom: 9,
  zoomControl: false, worldCopyJump: true, attributionControl: false
});
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.attribution({ position: 'bottomright', prefix: false }).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: '底图 © Esri'
}).addTo(map);

/* ---------------- 双层缓冲：新帧加载完成后再替换旧帧，动画不闪空 ---------------- */
function makeLayer() {
  return new EnhanceLayer(TILE_URL, {
    tileSize: 256, maxNativeZoom: 6, maxZoom: 9,
    enhanced: true, time: '',
    attribution: '云图: NASA GIBS · JMA 向日葵-8/9'
  });
}
const layers = [makeLayer(), makeLayer()];
let cur = 0, userOpacity = .85, swapToken = 0;
let playing = false, stepTO = null, fallbackTO = null;

// 地名/边界参考线：独立窗格，始终在云图之上
map.createPane('labels');
map.getPane('labels').style.zIndex = 350;
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, opacity: .9, pane: 'labels'
}).addTo(map);

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setFrame(i) {
  idx = i;
  $('tl').value = i;
  const t = new Date(frames[i]).toISOString().replace('.000', '');
  const missing = badFrames.has(frames[i]);
  if (!missing && layers[cur].options.time !== t) {
    const next = 1 - cur, nl = layers[next], token = ++swapToken;
    nl.options.time = t;
    nl.setOpacity(userOpacity);
    statusEl.textContent = '加载中…';
    nl.once('load', () => {
      if (token !== swapToken) return;          // 已被更新的切换取代
      map.removeLayer(layers[cur]);             // 此刻才撤下旧帧
      cur = next;
      statusEl.textContent = '';
      if (playing) {                            // 自适应播放节奏：加载完再走下一帧
        clearTimeout(fallbackTO);
        clearTimeout(stepTO);
        stepTO = setTimeout(playTick, 450);
      }
    });
    nl.addTo(map);                              // 旧帧保持显示，新帧就绪后才替换
  }
  const d = new Date(frames[i]);
  $('time').textContent = d.toLocaleString('zh-CN', {
    timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }) + ' 北京时' + (missing ? '（该时刻缺图）' : '');
  $('frame').textContent = (i + 1) + '/' + frames.length;
}

function playTick() {
  if (!playing) return;
  let n = idx;
  for (let k = 0; k < frames.length; k++) {     // 跳过缺图帧
    n = (n + 1) % frames.length;
    if (!badFrames.has(frames[n])) break;
  }
  setFrame(n);
  clearTimeout(fallbackTO);
  fallbackTO = setTimeout(playTick, 5000);      // 网络异常时兜底推进
}

function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? '⏸' : '▶';
  clearTimeout(stepTO); clearTimeout(fallbackTO);
  if (on) playTick();
}
$('play').onclick = () => setPlaying(!playing);

/* 时间范围切换：实时 / 5 天回放 */
function setMode(m) {
  if (mode === m) return;
  mode = m;
  setPlaying(false);
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  buildFrames();
  probeFrames();
  setFrame(frames.length - 1);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));

$('tl').oninput  = e => setFrame(+e.target.value);
$('enh').onchange = e => layers.forEach(l => { l.options.enhanced = e.target.checked; l.redraw(); });
$('op').oninput  = e => { userOpacity = e.target.value / 100; layers[cur].setOpacity(userOpacity); };

/* 色标 */
(function paintLegend(){
  const ctx = $('lg').getContext('2d');
  for (let x = 0; x < 266; x++) {
    const o = Math.round(x / 265 * 255) * 3;
    ctx.fillStyle = `rgb(${LUT[o]},${LUT[o+1]},${LUT[o+2]})`;
    ctx.fillRect(x, 0, 1, 12);
  }
})();

/* ---------------- 台风形成过程图解 ---------------- */
const STAGES = [
  { t: '① 暖洋面蒸发',    d: '热带洋面温度超过 26.5℃ 时，大量海水蒸发，暖湿空气不断抬升。云图对照：洋面上零星冒出的白色对流云点。' },
  { t: '② 凝结释放潜热',  d: '水汽在高空凝结成云并释放潜热，空气被加热后上升得更猛烈，近海面形成低压中心。云图对照：云团越来越密、云顶越来越亮（颜色向黄红发展）。' },
  { t: '③ 气流旋转启动',  d: '四周空气向低压中心补充，受地转偏向力作用（北半球逆时针）开始旋转。云图对照：云系开始出现弯曲的螺旋结构。' },
  { t: '④ 螺旋云带组织化', d: '上升—凝结—加热形成正反馈，云系组织成螺旋雨带，风力持续增强，台风诞生。云图对照：清晰的螺旋云带绕中心旋转。' },
  { t: '⑤ 风眼形成、成熟', d: '中心空气下沉增温、云消风散，形成风眼；风眼周围的眼墙才是风力最强之处。云图对照：螺旋中心出现圆润的风眼，眼墙呈红紫色。' }
];
let stageIdx = 0;
const dotsEl = $('howDots');
STAGES.forEach((_, i) => {
  const s = document.createElement('span');
  s.onclick = () => showStage(i);
  dotsEl.appendChild(s);
});
function showStage(i) {
  stageIdx = Math.max(0, Math.min(STAGES.length - 1, i));
  STAGES.forEach((_, k) => $('s' + (k + 1)).classList.toggle('on', k === stageIdx));
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === stageIdx));
  $('capTitle').textContent = STAGES[stageIdx].t;
  $('capText').textContent  = STAGES[stageIdx].d;
  $('howPrev').disabled = stageIdx === 0;
  $('howNext').disabled = stageIdx === STAGES.length - 1;
}
$('howPrev').onclick = () => showStage(stageIdx - 1);
$('howNext').onclick = () => showStage(stageIdx + 1);
$('how').onclick      = () => { $('howOverlay').classList.add('show'); showStage(0); };
$('howClose').onclick = () => $('howOverlay').classList.remove('show');
$('howOverlay').onclick = e => { if (e.target === e.currentTarget) $('howOverlay').classList.remove('show'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('howOverlay').classList.remove('show'); });
showStage(0);

/* ---------------- 启动 ---------------- */
buildFrames();
probeFrames();
setFrame(frames.length - 1);
setInterval(() => { buildFrames(); probeFrames(); }, 5 * 60000); // 每 5 分钟刷新可用帧
</script>
</body>
</html>
